<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Notes Demo</h1>
        <p>Простой CRUD поверх PostgreSQL через Docker Compose и Caddy.</p>
      </header>

      <section class="form-section">
        <h2>Новая запись</h2>
        <form id="note-form">
          <label>
            Заголовок
            <input id="title" name="title" required maxlength="120" placeholder="Например: Идея" />
          </label>
          <label>
            Текст
            <textarea id="body" name="body" rows="4" placeholder="Короткое описание..."></textarea>
          </label>
          <button type="submit">Добавить</button>
        </form>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section>
        <div class="list-header">
          <h2>Записи</h2>
          <button type="button" id="refresh" class="secondary">Обновить</button>
        </div>
        <ul id="notes"></ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
